{% for item in courses|slice:"0:6" %}
<div class="group bg-white dark:bg-slate-900 rounded-md shadow-md hover:shadow-lg shadow-slate-100 dark:shadow-slate-800 transition duration-500">
    <div class="p-3 pb-0 relative">
        <div class="relative overflow-hidden rounded-md">
            <img src="{{ item.img }}" class="group-hover:scale-105 duration-500" alt="">
        </div>
        <div class="absolute start-6 top-6">
            <span class="bg-violet-600 text-white text-[12px] px-2.5 py-1 rounded-md h-4">Free</span>
            <span class="bg-violet-600 text-white text-[12px] px-2.5 py-1 rounded-md h-4">Event</span>
        </div>

        <div class="absolute -bottom-5 end-6">
            <span class="bg-violet-600 text-white size-10 flex items-center justify-center rounded-full shadow-md shadow-slate-100 dark:shadow-slate-800 font-semibold">{{ item.price }}</span>
        </div>
    </div>

    <div class="p-6">
        <div class="flex mb-3">
            <span class="text-slate-400 text-sm flex items-center"><i data-feather="book" class="text-slate-900 dark:text-white size-[14px] me-1"></i>{{ item.lessons }}</span>
            <span class="text-slate-400 text-sm flex items-center ms-3"><i data-feather="users" class="text-slate-900 dark:text-white size-[14px] me-1"></i>{{ item.students }}</span>
        </div>

        <a href="/course-detail/{{ item.id }}" class="text-lg hover:text-violet-600 font-medium">{{ item.title }}</a>

        <p class="text-slate-400 mt-2">{{ item.desc }}</p>

        <div class="flex justify-between mt-3">
            <span class="flex items-center"><img src="{{ item.img1 }}" class="size-8 rounded-full shadow shadow-slate-100 dark:shadow-slate-800 me-2" alt=""> <a href="" class="hover:text-violet-600 font-medium"> {{ item.name }}</a></span>
            <a href="" class="h-8 px-3 tracking-wide inline-flex items-center justify-center font-medium rounded-md bg-violet-600/10 hover:bg-violet-600 text-violet-600 hover:text-white text-sm">Explore <i class="mdi mdi-arrow-right align-middle ms-1"></i></a>
        </div>
    </div>
</div><!--end content-->
{% endfor %}
