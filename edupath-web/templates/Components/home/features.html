{% for item in features %}
<div class="p-6 shadow-lg shadow-slate-100 dark:shadow-slate-800 transition duration-500 rounded-2xl">
    <div class="size-16 bg-violet-600/5 text-violet-600 rounded-2xl flex align-middle justify-center items-center shadow-sm">
        <i class="{{ item.icon }}"></i>
    </div>

    <div class="content mt-6">
        <a href="" class="text-lg hover:text-violet-600 dark:text-white dark:hover:text-violet-600 transition-all duration-500 ease-in-out font-semibold">{{ item.title }}</a>
        <p class="text-slate-400 mt-3">{{ item.desc }}</p>
        
        <div class="mt-3">
            <a href="" class="hover:text-violet-600 dark:hover:text-violet-600 after:bg-violet-600 dark:text-white transition duration-500">Read More <i class="mdi mdi-arrow-right"></i></a>
        </div>
    </div>
</div><!--end content-->
{% endfor %}
